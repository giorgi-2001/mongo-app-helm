apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: global-issuer
spec:
  {{- if .Values.clusterIssuer.isLocal }}
  ca:
    secretName: local-ca-root-secret
  {{- else }}
  acme:
    server: https://letsencrypt.org
    email: {{ .Values.clusterIssuer.acmeEmail }}
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
    - http01:
        ingress:
          class: {{ .Values.clusterIssuer.ingressClass | default "nginx" }}
  {{- end }}