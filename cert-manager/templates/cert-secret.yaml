{{- if .Values.clusterIssuer.isLocal }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: local-ca-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-ca-root
  namespace: {{ .Release.Namespace }}
spec:
  isCA: true
  commonName: local-ca-root
  secretName: local-ca-root-secret
  issuerRef:
    name: local-ca-bootstrap
    kind: ClusterIssuer
{{- end }}
