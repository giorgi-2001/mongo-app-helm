{{- with (index .Values "kube-prometheus-stack" "grafana" "ingress" "tls") }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
spec:
  secretName: {{ required "kube-prometheus-stack.grafana.ingress.tls[0].secretName is required" (first .).secretName }}
  issuerRef:
    name: global-issuer
    kind: ClusterIssuer
  dnsNames:
    {{- range (first .).hosts }}
    - {{ required "kube-prometheus-stack.grafana.ingress.tls[0].hosts entries must not be empty" . | quote }}
    {{- end }}
{{- end }}
