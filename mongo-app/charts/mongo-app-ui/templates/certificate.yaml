{{- with .Values.ingress.tls }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mongo-app-tls
spec:
  secretName: {{ required "ingress.tls[0].secretName is required" (first .).secretName }}
  issuerRef:
    name: global-issuer
    kind: ClusterIssuer
  dnsNames:
    {{- range (first .).hosts }}
    - {{ required "ingress.tls[0].hosts entries must not be empty" . | quote }}
    {{- end }}
{{- end }}
