replicaCount: 1
image:
  repository: REPLACE_WITH_UI_IMAGE
  tag: REPLACE_WITH_UI_TAG
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
env: []
serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 80
  containerPort: 80
ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: mongo-app-ui
              port:
                number: 80
  tls: []
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames: []
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
resources: {}
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}