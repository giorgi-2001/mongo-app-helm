apiVersion: v2
name: mongo-app-stack
description: Parent chart for the Mongo app UI and backend
type: application
version: 0.1.0
appVersion: "1.16.0"
dependencies: 
  - name: mongodb
    version: "20.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: mongodb.enabled

  - name: mongo-app-ui
    version: "0.1.0"
    repository: "file://charts/mongo-app-ui"

  - name: mongo-app
    version: "0.1.0"
    repository: "file://charts/mongo-app"
