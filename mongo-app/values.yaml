mongo-app:
  fullnameOverride: mongo-app
  image:
    pullPolicy: IfNotPresent
    repository: giorgi023/mongo-app
    tag: 042cdee0155aa81141a29850523f7dba7e8f5384
  service:
    containerPort: 8000
    port: 8000
    type: ClusterIP
  env:
  - name: MONGO_URI
    valueFrom:
      secretKeyRef:
        key: mongo_uri
        name: mongo-app-secret
  - name: DB_NAME
    valueFrom:
      secretKeyRef:
        key: database
        name: mongo-app-secret
  - name: OTEL_ENDPOINT
    value: http://otel-collector.monitoring.svc.cluster.local:4317
  - name: FRONTEND_HOSTNAME
    value: https://localhost:443
  - name: GOOGLE_CLIENT_ID
    valueFrom:
      secretKeyRef:
        key: google-client-id
        name: google-secret
  - name: GOOGLE_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        key: google-client-secret
        name: google-secret
  livenessProbe: {}
  readinessProbe: {}
  replicaCount: 1
  resources: {}
mongo-app-ui:
  fullnameOverride: mongo-app-ui
  image:
    pullPolicy: IfNotPresent
    repository: giorgi023/mongo-app-ui
    tag: 042cdee0155aa81141a29850523f7dba7e8f5384
  service:
    containerPort: 80
    port: 80
    type: ClusterIP
  env: []
  ingress:
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: mongo-force-https@traefik
      cert-manager.io/cluster-issuer: "global-issuer"
    className: traefik
    enabled: true
    hosts:
    - host: localhost
      paths:
      - backend:
          service:
            name: mongo-app-ui
            port:
              number: 80
        path: /
        pathType: Prefix
    tls:
    - hosts:
      - localhost
      secretName: mongo-ui-tls-secret
  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http
  replicaCount: 1
  resources: {}
mongodb:
  enabled: true
  architecture: standalone
  auth:
    database: mydatabase
    enabled: true
    existingSecret: mongo-app-secret
    username: appuser
  persistence:
    enabled: true
    size: 8Gi
