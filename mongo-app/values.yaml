mongo-app:
  env:
  - name: MONGO_URI
    valueFrom:
      secretKeyRef:
        key: mongo_uri
        name: mongo-app-secret
  - name: DB_NAME
    valueFrom:
      secretKeyRef:
        key: database
        name: mongo-app-secret
  - name: OTEL_ENDPOINT
    value: http://otel-collector.monitoring.svc.cluster.local:4317
  fullnameOverride: mongo-app
  image:
    pullPolicy: IfNotPresent
    repository: giorgi023/mongo-app
    tag: e17c43a25e3012698c7a18989069b3df94603e53
  livenessProbe: {}
  readinessProbe: {}
  replicaCount: 1
  resources: {}
  service:
    containerPort: 8000
    port: 8000
    type: ClusterIP
mongo-app-ui:
  env: []
  fullnameOverride: mongo-app-ui
  httpRoute:
    annotations: {}
    enabled: false
    hostnames: []
    parentRefs:
    - name: gateway
      sectionName: http
    rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
  image:
    pullPolicy: IfNotPresent
    repository: giorgi023/mongo-app-ui
    tag: e17c43a25e3012698c7a18989069b3df94603e53
  ingress:
    annotations: {}
    className: traefik
    enabled: true
    hosts:
    - host: localhost
      paths:
      - backend:
          service:
            name: mongo-app-ui
            port:
              number: 80
        path: /
        pathType: Prefix
    tls:
    - hosts:
      - localhost
      secretName: mongo-ui-tls-secret
  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http
  replicaCount: 1
  resources: {}
  service:
    containerPort: 80
    port: 80
    type: ClusterIP
mongodb:
  architecture: standalone
  auth:
    database: mydatabase
    enabled: true
    existingSecret: mongo-app-secret
    username: appuser
  enabled: true
  persistence:
    enabled: true
    size: 8Gi
